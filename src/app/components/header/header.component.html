<header class="topbar super" *ngIf="esSuper; else normal">
  <nav class="crumbs" aria-label="Ruta">
    <a routerLink="/admin">GASBACORB</a><span>/</span><strong>{{ tituloPagina }}</strong>
  </nav>

  <form class="super-search" (ngSubmit)="buscar()">
    <i class="fas fa-search"></i>
    <input type="search" name="busqueda" [(ngModel)]="busqueda" placeholder="Buscar empresa, RUC o correo…" aria-label="Buscar empresa" />
  </form>

  <div class="right-section">
    <span class="moneda"><i class="fas fa-coins"></i> Soles (S/.) Perú</span>
    <button type="button" class="btn-registrar" (click)="registrarEmpresa()"><i class="fas fa-plus"></i> Registrar empresa</button>
    <app-campana></app-campana>
    <app-menu-usuario></app-menu-usuario>
  </div>
</header>

<ng-template #normal>
<header class="topbar">
  <div class="company">
    <span class="company-icon"><i class="fas fa-store"></i></span>
    <div>
      <nav class="page-crumbs" aria-label="Ruta">
        <a routerLink="/admin">{{ empresaNombre || 'Minimarket' }}</a><span>/</span><strong>{{ tituloNormal }}</strong>
      </nav>
      <div class="company-line">
        <small *ngIf="sucursal"><i class="fas fa-location-dot"></i> {{ sucursal }}</small>
        <span class="chip" *ngIf="ruc">RUC {{ ruc }}</span>
      </div>
    </div>
  </div>

  <div class="right-section">
    <span class="fecha"><i class="far fa-calendar"></i> {{ hoy | date:'EEE d MMM, y' }}</span>

    <a class="caja-pill" *ngIf="mostrarCaja" [class.off]="!cajaNombre" routerLink="/admin/list-apertura"
       [attr.title]="cajaNombre ? 'Ir a control de caja' : 'No tienes una caja abierta'">
      <span class="pulse"></span>
      {{ cajaNombre ? cajaNombre + ': Abierta' : 'Sin caja abierta' }}
    </a>

    <app-campana></app-campana>

    <app-menu-usuario></app-menu-usuario>
  </div>
</header>

</ng-template>
