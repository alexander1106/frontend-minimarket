<div class="recuperar-wrapper">
  <form class="recuperar-card" (ngSubmit)="guardar()">
    <h2>Nueva contraseña</h2>
    <input type="password" name="nuevaClave" [(ngModel)]="nuevaClave" placeholder="Nueva contraseña (mín. 6 caracteres)" required />
    <input type="password" name="confirmar" [(ngModel)]="confirmar" placeholder="Confirmar contraseña" required />
    <button type="submit" [disabled]="enviando">Cambiar contraseña</button>
    <a routerLink="/login">Volver al inicio de sesión</a>
  </form>
</div>
