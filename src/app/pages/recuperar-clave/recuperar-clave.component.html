<div class="recuperar-wrapper">
  <form class="recuperar-card" (ngSubmit)="enviar()">
    <h2>Recuperar contraseña</h2>
    <p>Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
    <input type="email" name="email" [(ngModel)]="email" placeholder="Correo electrónico" required />
    <button type="submit" [disabled]="enviando">Enviar enlace</button>
    <a routerLink="/login">Volver al inicio de sesión</a>
  </form>
</div>
